# Builds the PWA and publishes it on GitHub Pages at every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site: served under /<repo>/.
      BASE_PATH: /${{ github.event.repository.name }}/
      # Public by design (project URL + publishable key). Never put the sb_secret_ key here.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Without them the build would silently ship a local-only app.
      - name: Check Supabase settings
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_KEY" ] || { echo "::error::Missing VITE_SUPABASE_URL / VITE_SUPABASE_KEY repository secrets"; exit 1; }
          case "$VITE_SUPABASE_KEY" in sb_publishable_*) ;; *) echo "::error::VITE_SUPABASE_KEY must be the publishable key"; exit 1 ;; esac
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
